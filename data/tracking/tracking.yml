path:
  title: "Ascension Path"
  property: "tscend_tracker_path"
  fields:
    - { name: subject, label: "Subject", type: [familiar, item, string] }
    - { name: detail, label: "Detail", type: string }

banishes:
  title: "Banishes"
  property: "tscend_banishes"
  fields:
    - { name: monster, label: "Monster", type: [monster, phylum] }
    - { name: location, label: "Location", type: location, optional: true }
    - { name: source, label: "Source", type: string }

freeRuns:
  title: "Free Runs"
  property: "tscend_freeruns"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

yellowRays:
  title: "Yellow Rays"
  property: "tscend_yellowRays"
  icon: images/itemimages/eyes.gif
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

sniffing:
  title: "Sniffing"
  property: "tscend_sniffs"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }
# A copy is something that doesn't occur "later"
copies:
  title: "Copies"
  property: "tscend_copies"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: location, label: "Location", type: location }
    - { name: source, label: "Source", type: string }
# A summon is where you spin a monster out of thin air
summons:
  title: "Summons"
  property: "tscend_summons"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }
# A wanderer is when you're copying a monster, but it'll occur later
wanderers:
  title: "Wanderers"
  property: "tscend_wanderers"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

replaces:
  title: "Replaces"
  property: "tscend_replaces"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

freekills:
  title: "Free Kills"
  property: "tscend_freekills"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

instakills:
  title: "Instakills"
  property: "tscend_instakills"
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: source, label: "Source", type: string }

forcedNoncombats:
  title: "Forced Noncombats"
  property: "tscend_forcedNC"
  fields:
    - { name: source, label: "Source", type: string }
    - { name: location, label: "Location", type: location }
    - { name: encounter, label: "Encounter", type: string }
    - { name: turnsSaved, label: "Turns Saved", type: string }

stomach:
  title: "Stomach"
  property: "tscend_eaten"
  fields:
    - { name: item, label: "Item", type: [item, string] }
    - { name: detail, label: "Detail", type: string, optional: true }

liver:
  title: "Liver"
  property: "tscend_drunken"
  fields:
    - { name: item, label: "Item", type: [item, string] }
    - { name: detail, label: "Detail", type: string, optional: true }

spleen:
  title: "Spleen"
  property: "tscend_chewed"
  fields:
    - { name: item, label: "Item", type: item }
    - { name: detail, label: "Detail", type: string, optional: true }

wishes:
  title: "Wishes"
  property: "tscend_wishes"
  fields:
    - { name: source, label: "Source", type: item }
    - { name: location, label: "Location", type: location, optional: true }
    - { name: wish, label: "Wish", type: string }

luckyAdventures:
  title: "Lucky Adventures"
  property: "tscend_lucky"
  fields:
    - { name: source, label: "Source", type: string }
    - { name: location, label: "Location", type: location }
    - { name: encounter, label: "Encounter", type: string }

lashOfTheCobra:
  title: "Lash of the Cobra"
  property: "tscend_lashes"
  icon: images/itemimages/cobrahead.gif
  condition: isActuallyEd
  fields:
    - { name: monster, label: "Monster", type: monster }

talismanOfRenenutet:
  title: "Talisman of Renenutet"
  property: "tscend_renenutet"
  icon: images/itemimages/tal_r.gif
  condition: isActuallyEd
  fields:
    - { name: monster, label: "Monster", type: monster }

ocrsFunTimes:
  title: "OCRS Fun Times"
  property: "tscend_funTracker"
  condition: inOcrs
  fields:
    - { name: monster, label: "Monster", type: monster }
    - { name: fun, label: "Fun", type: string }

pulls:
  title: "Pulls"
  property: "tscend_pulls"
  condition: notHardcore
  fields:
    - { name: item, label: "Item", type: item }
    - { name: pulledBy, label: "Pulled By", type: string, optional: true }

powerfulGlove:
  title: "Powerful Glove"
  property: "tscend_powerfulglove"
  condition: hasPowerfulGlove
  fields:
    - { name: skill, label: "Skill", type: skill }

iotmsUsed:
  title: "IOTM's Used"
  property: "tscend_iotm_claim"
  fields:
    - { name: iotm, label: "Source", type: [item, string] }
    - { name: detail, label: "Detail", type: string }

monstersMapped:
  title: "Monsters Mapped"
  property: "tscend_mapperidot"
  fields:
    - { name: source, label: "Source", type: [item, skill] }
    - { name: location, label: "Location", type: location }
    - { name: monster, label: "Monster", type: monster, optional: true }
    - { name: detail, label: "Detail", type: string, optional: true }

otherStuff:
  title: "Other Stuff"
  property: "tscend_otherstuff"
  fields:
    - {
        name: event,
        label: "Event",
        type: [monster, item, familiar, skill, phylum, string],
      }
    - { name: location, label: "Location", type: location, optional: true }
    - { name: detail, label: "Detail", type: string, optional: true }

beatenUp:
  title: "Beaten Up"
  property: "tscend_beatenUpLocations"
  fields:
    - { name: location, label: "Location", type: location }
    - { name: detail, label: "Detail", type: string }
