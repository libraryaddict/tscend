tscend_doneInitialize:
  name: "Last Initialized Ascension"
  type: int
  description: Indicates last ascension that we initialized with the script.
  default: 0
tscend_doneRelayInitialize:
  name: "Last Relay Initialized Ascension"
  type: int
  description: Indicates last ascension that the relay page applied setting resets for.
  default: 0
tscend_day_init:
  name: "Day Initialized"
  type: int
  description: Current daycount if we finished initializing today.
  default: 0
  resets: ascend
tscend_clanstuff:
  name: "Last 'end of day' for Clan"
  type: int
  description: What was the last day we did 'end of day' clan stuff.
  default: 0
  resets: ascend
tscend_beatenUpCount:
  name: "Beaten Up Count"
  type: int
  description: How many times were we beaten up this ascension. Affects ML and whether we try to heal or abort when we get beaten up.
  default: 0
  resets: ascend
tscend_powerLevelLastLevel:
  name: "Last Powerleveling Level"
  type: int
  description: Last Level that we had nothing to do.
  default: 0
  resets: day
tscend_powerLevelAdvCount:
  name: "Powerleveling Adventure Count"
  type: int
  description: Adventures count of times we had nothing to do.
  default: 0
  resets: ascend
tscend_powerLevelLastAttempted:
  name: "Last Powerleveling Adventure"
  type: int
  description: Last adventure that we did nothing on.
  default: 0
  resets: ascend
tscend_gnasirUnlocked:
  name: "Gnasir Found (Desert Quest)"
  type: boolean
  description: Have we found gnasir in the Desert?
  default: false
  resets: ascend
tscend_chasmBusted:
  name: "Orc Chasm Bridge Trolled"
  type: boolean
  description: Has the orc chasm bridge been 'trolled yet? Ed only.
  default: true
  resets: ascend
tscend_haveoven:
  name: "Have Oven"
  type: boolean
  description: Track oven status. If you have an oven this should be true. But we can't always check the campground.
  default: false
  resets: ascend
