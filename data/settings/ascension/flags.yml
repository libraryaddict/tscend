tscend_getSteelOrgan:
  name: "Get Steel Organ"
  type: boolean
  description: Get Steel Organ in this ascension?
  default: false
tscend_getBeehive:
  name: "Get Beehive"
  type: boolean
  description: Get Beehive in this ascension?
  default: false
  resets: ascend
tscend_getStarKey:
  name: "Get Richard's Star Key"
  type: boolean
  description: Get Richard's Star Key in this ascension?
  default: true
  resets: ascend
tscend_holeinthesky:
  name: "Open Hole In The Sky"
  type: boolean
  description: Open the Hole in the Sky in this ascension?
  default: true
  resets: ascend
tscend_hippyInstead:
  name: "Fight For Hippies"
  type: boolean
  description: Fight on the side of the hippies instead of the Frat Warriors in this ascension?
  default: false
  resets: ascend
tscend_ignoreFlyer:
  name: "Skip Flyer Quest"
  type: boolean
  description: Do not do the flyer quest in this ascension? recommended to set true if fighting for the hippies.
  default: false
  resets: ascend
tscend_wandOfNagamar:
  name: "Get Wand Of Nagamar"
  type: boolean
  description: Do we need to get a Wand of Nagamar in this ascension?
  default: true
  resets: ascend
tscend_dontPhylumBanish:
  name: "Don't Banish Phylums"
  type: boolean
  description: If false will banish enemy phyla. Banishing should save some turns, but can interfere with the routing, and may mess up later banishes / tracks.
  default: false
  resets: ascend
tscend_runDayCount:
  name: "Expected Day Count"
  type: int
  description: How many days do you think your run will take? Defaults to 2.
  default: 2
  resets: ascend
tscend_getBoningKnife:
  name: "Get Boning Knife"
  type: boolean
  description: Do we want Boning Knife this ascension?
  default: false
  resets: ascend
tscend_grimstoneFancyOilPainting:
  name: "Grimstone For Fancy Oil Painting"
  type: boolean
  description: do grimstone for fancy oil painting this ascension?
  default: true
  resets: ascend
tscend_grimstoneOrnateDowsingRod:
  name: "Grimstone For Ornate Dowsing Rod"
  type: boolean
  description: do grimstone for ornate dowsing rod this ascension?
  default: true
  resets: ascend
tscend_hedge:
  name: "Hedge Maze Speed"
  type: string
  description: "'fast' or 'slow', determining how quickly we want to finish the Hedge Maze."
  default: "fast"
  resets: ascend
tscend_skipNuns:
  name: "Mysterious Island War: Skip Nuns Quest"
  type: boolean
  description: Skip nuns quest this ascension?
  default: false
  resets: ascend
tscend_100familiar:
  name: "100% Familiar"
  type: familiar
  description: If a familiar type, do not allow familiar switching (for 100% runs). Otherwise, can be none or blank.
  default: ""
tscend_doGalaktik:
  name: "Galaktik Sidequest"
  type: boolean
  description: Do Galaktik optional sidequest this ascension?
  default: false
tscend_l8_ninjaAssassinFail:
  name: "Avoid Ninja Snowmen Assassins"
  type: boolean
  description: True means we think we cannot defeat ninja snowmen assassins and are thus avoiding them this ascension. We will not copy them nor adventure in the lair of the ninja snowmen
  default: false
  resets: ascend
tscend_l8_extremeInstead:
  name: "Use Extreme Slope Instead"
  type: boolean
  description: True means we want to adventure in the extreme slope path instead of the ninja snowmen lair this ascension.
  default: false
  resets: ascend
tscend_needLegs:
  name: "Need Legs Before Ka Farming"
  type: boolean
  description: In Ed, do we require getting legs before trying to Ka farm?
  default: false
