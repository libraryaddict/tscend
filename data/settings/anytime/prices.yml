auto_consumablePriceLimit:
  name: "Consumable Price Limit"
  type: int
  description: Max price of consumables to eat (including pulls). Will still not go above mafia autobuy limit.
  default: 12000
auto_maxCandyPrice:
  name: "Max Candy Price"
  type: int
  description: Max allowable price per candy for Rethinking Candy (default 2500)
auto_meat_surplus:
  name: "Meat Surplus"
  type: int
  description: "Tells autoscend to stop worrying about maximizing for meat (unless relevant) when we have a surplus over this amount of meat"
  default: 5000
