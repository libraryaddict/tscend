auto_maximize_smarter:
  name: "Smarter Maximize"
  type: boolean
  description: "Tells maximizer to try be smarter by applying limits to what it considers to be unimportant resources, for a new player, the setting is best left turned off as this setting aims at removing some of safety guidelines"
  default: false
auto_maximize_baseline:
  name: "Maximizer Baseline"
  type: string
  description: 'The string to use as the baseline for the maximizer when deciding gear. If this is blank or "default", it will use a generated maximizer statement that takes your current situation in to account somewhat. Use "{default}" if you want that string to be injected into your provided statement, eg if you were trying to wear a certain item as much as possible "+10000 bonus iotm_name, {default}" to get the best of both worlds. - NOTE: This doesn''t take into account that the script no longer runs builds maximizer with raw strings. Your maximizer statement, if you''re doing something fiddly, should be formatted cleanly and without abbreviations. No promises are made for continued support for any of the settings contained here.'
  default: ""
  tags: [equipment]
