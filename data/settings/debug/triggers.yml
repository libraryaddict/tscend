tscend_interrupt:
  name: "Auto Interrupt"
  type: boolean
  description: Script will abort after the next action is finished (instead of mid turn which can cause problems). Will be reset to false after every time it is used.
  default: false
tscend_stop:
  name: "Auto Stop"
  type: boolean
  description: Script will gracefully stop (not abort) before or after attempting to adventure somewhere, but not during the pre or post adventure script. This is an alternative to abort, where you do not want to kill the entire script chain. Eg, when you're calling tscend as part of your day in an advanced setup.
  default: false
tscend_newbieOverride:
  name: "Newbie Override"
  type: boolean
  description: If true will override newbie block once then set itself to false. Newbie block is enabled used when you fight a crate (please report crate fighting) or when you spent too many adventures in a zone
  default: false
tscend_disableAdventureHandling:
  name: "Disable Pre & Post Adv Scripts"
  type: boolean
  description: When true this prevents preadventure and postadventure scripts from running. resets every loop.
  default: false
  resets: ascend
tscend_disableFamiliarChanging:
  name: "Disable Familiar Changing"
  type: boolean
  description: When true this prevents familiar changes. resets every loop.
  default: false
tscend_combatDirective:
  name: "Combat Directive"
  type: string
  description: An action to execute at the start of next combat. resets every loop.
  default: ""
tscend_interruptZones:
  name: "Interrupt Zones"
  type: tags
  description: Semicolon-separated (;) list of zones to abort in before starting the first adventure. Once per location.
  default: ""
  allowDuplicateTags: false
  tagsSeperator: ";"
  possibleValuesSource: locations
