auto_clanVIPLounge:
  type: string
  description: "The name or ID of the clan you want to use for VIP lounge stuff, this supports a very limited subset of iotms. Will fallback to 'The Average Clan' if you happen to be in there."
  default: "Bonus Adventures from Hell"
auto_hideAdultery:
  name: "Hide Zatara Consults"
  type: boolean
  description: When true, automatically deletes Zatara Consults from Kmails during end of day cleanup.
  tags: ["fortune teller"]
auto_optimizeConsultsInRun:
  name: "Optimize Zatara Consults"
  type: boolean
  description: When true, optimize our consults in run to get Ascension relevant rewards.
  tags: ["fortune teller"]
auto_consultClan:
  name: "Zatara Consult Clan"
  type: string
  description: The clan you want to do Zatara consults in. Defaults to 'auto_clanVIPLounge' unless configured.
  tags: ["fortune teller"]
auto_consultChoice:
  name: "Zatara Consult Player"
  type: string
  description: The name of the player you want to do Zatara consults with. Is automatically handled in 'The Average Clan' and 'Bonus Adventures from Hell'
  default: OnlyFax
  tags: ["fortune teller"]
