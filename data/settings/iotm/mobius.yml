auto_mobiusRingClocks:
  name: "Möbius Ring Clocks"
  type: int
  description: "How many clocks we claim from the Möbius ring, before trying to raise paradoxicity instead. Once we have 15 paradoxicity we take clocks regardless."
  default: 2
  possibleValues:
    - value: "0"
      display: "None"
    - value: "1"
      display: "One (5 adv)"
    - value: "2"
      display: "Two (5+3 adv)"
auto_mobiusRingFamiliarExp:
  name: "Möbius Ring Familiar Experience"
  type: boolean
  description: "When true (and relevant) we take the effect 'Lifted by your Bootstraps' for 100 turns of +5 familiar experience, instead of raising paradoxicity."
  default: true
